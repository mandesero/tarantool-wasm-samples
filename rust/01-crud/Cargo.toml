[package]
name = "adder"
version = "0.1.0"
edition = "2024"

[dependencies]
wit-bindgen-rt = { version = "0.43.0", features = ["bitflags"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "component:adder"

[package.metadata.component.target]
path = "wit"
world = "adder"

[package.metadata.component.target.dependencies]
"tarantool:tarantool" = { path = "wit/deps/tarantool-tarantool-0.1.4.wasm" }
"wasi:cli" = { path = "wit/deps/wasi-cli-0.2.3.wasm" }
